name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release bundle
    runs-on: ubuntu-latest
    env:
      # Keep uv run from implicitly installing the editable project before the
      # explicitly constrained distribution build below.
      UV_NO_SYNC: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Require successful CI gate for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_runs="$(mktemp)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=CI%20gate&filter=latest&per_page=100" \
            > "${check_runs}"
          CHECK_RUNS_PATH="${check_runs}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          payload = json.loads(
              Path(os.environ["CHECK_RUNS_PATH"]).read_text(encoding="utf-8")
          )
          matches = [
              check
              for check in payload["check_runs"]
              if check["name"] == "CI gate"
              and check["head_sha"] == sha
              and check.get("app", {}).get("slug") == "github-actions"
          ]
          if not matches or not any(
              check["conclusion"] == "success" for check in matches
          ):
              states = [
                  f"{check['status']}/{check['conclusion']}" for check in matches
              ]
              detail = ", ".join(states) if states else "not found"
              raise SystemExit(
                  f"CI gate for tagged commit {sha} is not successful: {detail}"
              )
          print(f"Confirmed successful CI gate for {sha}")
          PY
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - name: Install locked validation and build dependencies
        run: >-
          uv sync --all-groups --all-extras --locked --no-install-project
          --no-build

      - name: Validate release version
        id: version
        run: |
          tag_commit="$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} resolves to ${tag_commit}, not ${GITHUB_SHA}" >&2
            exit 1
          fi
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Run tests
        run: uv run pytest -m "not generated_assets and not package_artifact"
      - name: Check generated and verification assets
        run: bash scripts/check-generated.sh
      - name: Generate verification records from release checkout
        run: uv run python docs/scripts/generate_verification.py
      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run mypy
        run: uv run mypy
      - name: Build and test documentation
        run: |
          uv run sphinx-build -W --keep-going -b html docs docs/_build/html
          uv run sphinx-build -W --keep-going -b doctest docs docs/_build/doctest
      - name: Build Python distributions
        run: bash scripts/build-distributions.sh
      - name: Verify built wheel
        env:
          AEROPHYSICS_TEST_WHEEL_DIRECTORY: dist
        run: uv run pytest -m package_artifact --no-cov

      - name: Package HTML documentation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          version = os.environ["VERSION"]
          source = Path("docs/_build/html")
          archive = Path("dist") / f"aerophysics-docs-{version}.zip"
          prefix = Path(f"aerophysics-docs-{version}")

          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as output:
              for path in sorted(source.rglob("*")):
                  relative = path.relative_to(source)
                  if path.is_file() and not any(
                      part.startswith(".") for part in relative.parts
                  ):
                      output.write(path, prefix / relative)
          PY

      - name: Verify release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          version = os.environ["VERSION"]
          expected = [
              Path("dist") / f"aerophysics-{version}-py3-none-any.whl",
              Path("dist") / f"aerophysics-{version}.tar.gz",
              Path("dist") / f"aerophysics-docs-{version}.zip",
          ]
          missing = [str(path) for path in expected if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing release assets: {', '.join(missing)}")

          prefix = f"aerophysics-docs-{version}"
          with ZipFile(expected[-1]) as archive:
              names = set(archive.namelist())
          required_docs = {
              f"{prefix}/index.html",
              f"{prefix}/getting_started/index.html",
              f"{prefix}/getting_started/installation.html",
              f"{prefix}/getting_started/quickstart.html",
              f"{prefix}/getting_started/conventions.html",
              f"{prefix}/guides/index.html",
              f"{prefix}/guides/atmosphere_flight.html",
              f"{prefix}/guides/compressible_flow.html",
              f"{prefix}/guides/boundary_layers.html",
              f"{prefix}/guides/vectorization_errors.html",
              f"{prefix}/guides/gui.html",
              f"{prefix}/models/index.html",
              f"{prefix}/models/gas_and_atmosphere.html",
              f"{prefix}/models/transport_properties.html",
              f"{prefix}/models/thermochemistry.html",
              f"{prefix}/models/isentropic_flow.html",
              f"{prefix}/models/shock_waves.html",
              f"{prefix}/models/expansion_waves.html",
              f"{prefix}/models/flat_plate_boundary_layer.html",
              f"{prefix}/models/compressible_velocity_transformations.html",
              f"{prefix}/models/protrusion_drag.html",
              f"{prefix}/models/flight_conditions.html",
              f"{prefix}/models/unit_conversions.html",
              f"{prefix}/verification/index.html",
              f"{prefix}/verification/standard_atmosphere.html",
              f"{prefix}/verification/compressible_flow.html",
              f"{prefix}/verification/thermophysical.html",
              f"{prefix}/verification/viscous_flow.html",
              f"{prefix}/api/index.html",
              f"{prefix}/api/thermophysical.html",
              f"{prefix}/api/compressible_flow.html",
              f"{prefix}/api/viscous_flow.html",
              f"{prefix}/api/flight_units.html",
              f"{prefix}/api/errors.html",
              f"{prefix}/references.html",
              f"{prefix}/searchindex.js",
              f"{prefix}/_static/basic.css",
          }
          missing_docs = sorted(required_docs - names)
          if missing_docs:
              raise SystemExit(
                  f"Missing documentation files: {', '.join(missing_docs)}"
              )
          legacy_docs = {
              f"{prefix}/quickstart.html",
              f"{prefix}/gas_and_atmosphere.html",
              f"{prefix}/transport_properties.html",
              f"{prefix}/thermochemistry.html",
              f"{prefix}/compressible_flow.html",
              f"{prefix}/boundary_layers.html",
              f"{prefix}/compressible_velocity_transformations.html",
              f"{prefix}/flight_conditions.html",
              f"{prefix}/unit_conversions.html",
              f"{prefix}/verification.html",
              f"{prefix}/verification_compressible_flow.html",
              f"{prefix}/verification_thermophysical.html",
              f"{prefix}/verification_viscous_flow.html",
              f"{prefix}/api.html",
          }
          unexpected_docs = sorted(legacy_docs & names)
          if unexpected_docs:
              raise SystemExit(
                  f"Legacy documentation files remain: {', '.join(unexpected_docs)}"
              )
          PY

      - name: Assemble and checksum verified release bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release-bundle
          cp \
            "dist/aerophysics-${VERSION}-py3-none-any.whl" \
            "dist/aerophysics-${VERSION}.tar.gz" \
            "dist/aerophysics-docs-${VERSION}.zip" \
            release-bundle/
          cd release-bundle
          sha256sum \
            "aerophysics-${VERSION}-py3-none-any.whl" \
            "aerophysics-${VERSION}.tar.gz" \
            "aerophysics-docs-${VERSION}.zip" \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Transfer verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest verified release bundle
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle
      - name: Verify checksums before attestation
        run: |
          cd release-bundle
          sha256sum --check SHA256SUMS
      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-bundle/*

  publish:
    name: Publish immutable GitHub Release
    needs:
      - build
      - attest
    runs-on: ubuntu-latest
    env:
      # This job deliberately has no checkout, so gh cannot infer a remote.
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle

      - name: Verify transferred bundle and checksums
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          BUNDLE_DIRECTORY=release-bundle python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          directory = Path(os.environ["BUNDLE_DIRECTORY"])
          expected = {
              f"aerophysics-{version}-py3-none-any.whl",
              f"aerophysics-{version}.tar.gz",
              f"aerophysics-docs-{version}.zip",
              "SHA256SUMS",
          }
          actual = {path.name for path in directory.iterdir() if path.is_file()}
          if actual != expected:
              missing = sorted(expected - actual)
              unexpected = sorted(actual - expected)
              raise SystemExit(
                  f"Invalid release bundle; missing={missing}, unexpected={unexpected}"
              )
          PY
          cd release-bundle
          sha256sum --check SHA256SUMS

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to replace assets" >&2
            exit 1
          fi

      - name: Publish GitHub Release once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          read -r tag_type tag_sha <<< "$(
            gh api \
              "repos/${GH_REPO}/git/ref/tags/${GITHUB_REF_NAME}" \
              --jq '.object | [.type, .sha] | @tsv'
          )"
          for _ in {1..16}; do
            if [[ "${tag_type}" == "commit" ]]; then
              break
            fi
            if [[ "${tag_type}" != "tag" ]]; then
              echo "Tag ${GITHUB_REF_NAME} targets unsupported object type ${tag_type}" >&2
              exit 1
            fi
            read -r tag_type tag_sha <<< "$(
              gh api \
                "repos/${GH_REPO}/git/tags/${tag_sha}" \
                --jq '.object | [.type, .sha] | @tsv'
            )"
          done
          if [[ "${tag_type}" != "commit" || "${tag_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} no longer targets built commit ${GITHUB_SHA}" >&2
            exit 1
          fi

          assets=(
            "release-bundle/aerophysics-${VERSION}-py3-none-any.whl"
            "release-bundle/aerophysics-${VERSION}.tar.gz"
            "release-bundle/aerophysics-docs-${VERSION}.zip"
            "release-bundle/SHA256SUMS"
          )
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
