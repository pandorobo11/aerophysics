name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            coverage: true
          - os: ubuntu-latest
            python: "3.13"
            coverage: false
          - os: ubuntu-latest
            python: "3.14"
            coverage: false
          - os: macos-latest
            python: "3.13"
            coverage: false
          - os: windows-latest
            python: "3.13"
            coverage: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - name: Run normal test suite with coverage
        if: matrix.coverage == true
        run: uv run pytest -m "not generated_assets and not package_artifact"
      - name: Run normal test suite without coverage
        if: matrix.coverage == false
        run: >-
          uv run pytest -m "not generated_assets and not package_artifact"
          --no-cov

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - run: uv run ruff check .

  format:
    name: Ruff format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - run: uv run ruff format --check .

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - run: uv run mypy

  generated-assets:
    name: Generated assets (Ubuntu, Python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - name: Check generated and verification assets
        run: bash scripts/check-generated.sh

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - name: Build HTML documentation
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Run documentation doctests
        run: uv run sphinx-build -W --keep-going -b doctest docs docs/_build/doctest

  package:
    name: Python package build and verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - run: uv run python -m build
      - name: Verify built wheel
        env:
          AEROPHYSICS_TEST_WHEEL_DIRECTORY: dist
        run: uv run pytest -m package_artifact --no-cov

  ci-gate:
    name: CI gate
    if: always()
    # Keep needs and every result check below synchronized with required CI jobs.
    needs:
      - test
      - lint
      - format
      - typecheck
      - generated-assets
      - docs
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          GENERATED_ASSETS_RESULT: ${{ needs['generated-assets'].result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          failed=0
          for check in \
            "test=${TEST_RESULT}" \
            "lint=${LINT_RESULT}" \
            "format=${FORMAT_RESULT}" \
            "typecheck=${TYPECHECK_RESULT}" \
            "generated-assets=${GENERATED_ASSETS_RESULT}" \
            "docs=${DOCS_RESULT}" \
            "package=${PACKAGE_RESULT}"
          do
            name="${check%%=*}"
            result="${check#*=}"
            if [[ "${result}" != "success" ]]; then
              echo "::error::${name} finished with ${result}"
              failed=1
            fi
          done
          exit "${failed}"
