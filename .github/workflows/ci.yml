name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            coverage: false
          - os: ubuntu-latest
            python: "3.13"
            coverage: false
          - os: ubuntu-latest
            python: "3.14"
            coverage: true
          - os: macos-latest
            python: "3.13"
            coverage: false
          - os: windows-latest
            python: "3.13"
            coverage: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - name: Run normal test suite with coverage
        if: matrix.coverage == true
        run: bash scripts/check-coverage.sh
      - name: Run normal test suite without coverage
        if: matrix.coverage == false
        run: >-
          uv run pytest -m "not generated_assets and not package_artifact and not solver_verification"
          --no-cov -n auto

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - run: uv run ruff check .

  format:
    name: Ruff format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - run: uv run ruff format --check .

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - run: uv run mypy

  generated-assets:
    name: Generated assets (Ubuntu, Python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - name: Check generated and verification assets
        run: bash scripts/check-generated.sh

  solver-verification:
    name: Solver verification (${{ matrix.shard }}, Ubuntu, Python 3.12)
    runs-on: ubuntu-24.04
    # Two shards halve the CI critical path; ci-gate sees one aggregated
    # result for this job id, which fails if either shard fails. The "other"
    # shard ignores the first shard's files, so new verification files run
    # there automatically. Balanced by measured CPU time (2026-11-09: 172 s
    # versus 194 s of 366 s).
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: SA and planar
            selection: >-
              tests/test_marching_boundary_layer_sa.py
              tests/test_marching_boundary_layer.py
          - shard: other
            selection: >-
              --ignore=tests/test_marching_boundary_layer_sa.py
              --ignore=tests/test_marching_boundary_layer.py
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - name: Decide whether solver verification is needed
        id: solver
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # A failed fetch leaves the decision script to fail safe on a missing ref.
            git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
            decision="$(VERIFICATION_BASE="origin/${BASE_REF}" bash scripts/needs-verification.sh solver 2>&1)"
            needed="${decision%%$'\n'*}"
            reason="${decision#*$'\n'}"
          else
            needed=yes
            reason="always run on main"
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [[ "$needed" == yes ]]; then
            printf 'Solver verification: %s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Solver verification skipped: %s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run solver verification
        if: steps.solver.outputs.needed == 'yes'
        run: >-
          uv run pytest -m solver_verification --no-cov -n auto --durations=15
          ${{ matrix.selection }}

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - name: Generate verification records from tested checkout
        run: uv run python docs/scripts/generate_verification.py
      - name: Build HTML documentation
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Run documentation doctests
        run: uv run sphinx-build -W --keep-going -b doctest docs docs/_build/doctest

  package-wheel:
    name: Python wheel build and verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - name: Decide whether package verification is needed
        id: package
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
            decision="$(VERIFICATION_BASE="origin/${BASE_REF}" bash scripts/needs-verification.sh package 2>&1)"
            needed="${decision%%$'\n'*}"
            reason="${decision#*$'\n'}"
          else
            needed=yes
            reason="always run on main"
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [[ "$needed" == yes ]]; then
            printf 'Package verification: %s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Package build and installation verification skipped: %s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build Python distributions
        if: steps.package.outputs.needed == 'yes'
        run: uv run python -m build
      - name: Verify clean wheel installation
        if: steps.package.outputs.needed == 'yes'
        env:
          AEROPHYSICS_TEST_ARTIFACT_DIRECTORY: dist
        run: uv run pytest -m "package_artifact and not package_sdist" --no-cov

  package-sdist:
    name: Python sdist build and verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --all-groups --all-extras --locked
      - name: Decide whether package verification is needed
        id: package
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
            decision="$(VERIFICATION_BASE="origin/${BASE_REF}" bash scripts/needs-verification.sh package 2>&1)"
            needed="${decision%%$'\n'*}"
            reason="${decision#*$'\n'}"
          else
            needed=yes
            reason="always run on main"
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [[ "$needed" == yes ]]; then
            printf 'Package verification: %s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Package build and installation verification skipped: %s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build source distribution
        if: steps.package.outputs.needed == 'yes'
        run: uv run python -m build --sdist
      - name: Verify clean sdist installation
        if: steps.package.outputs.needed == 'yes'
        env:
          AEROPHYSICS_TEST_ARTIFACT_DIRECTORY: dist
        run: uv run pytest -m "package_artifact and package_sdist" --no-cov

  ci-gate:
    name: CI gate
    if: always()
    # Keep needs and every result check below synchronized with required CI jobs.
    needs:
      - test
      - lint
      - format
      - typecheck
      - generated-assets
      - solver-verification
      - docs
      - package-wheel
      - package-sdist
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          GENERATED_ASSETS_RESULT: ${{ needs['generated-assets'].result }}
          SOLVER_VERIFICATION_RESULT: ${{ needs['solver-verification'].result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PACKAGE_WHEEL_RESULT: ${{ needs['package-wheel'].result }}
          PACKAGE_SDIST_RESULT: ${{ needs['package-sdist'].result }}
        run: |
          failed=0
          for check in \
            "test=${TEST_RESULT}" \
            "lint=${LINT_RESULT}" \
            "format=${FORMAT_RESULT}" \
            "typecheck=${TYPECHECK_RESULT}" \
            "generated-assets=${GENERATED_ASSETS_RESULT}" \
            "solver-verification=${SOLVER_VERIFICATION_RESULT}" \
            "docs=${DOCS_RESULT}" \
            "package-wheel=${PACKAGE_WHEEL_RESULT}" \
            "package-sdist=${PACKAGE_SDIST_RESULT}"
          do
            name="${check%%=*}"
            result="${check#*=}"
            if [[ "${result}" != "success" ]]; then
              echo "::error::${name} finished with ${result}"
              failed=1
            fi
          done
          exit "${failed}"
