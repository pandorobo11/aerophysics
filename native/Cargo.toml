[package]
name = "aerophysics_native"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["abi3-py312"] }
numpy = "=0.30.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
