[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aerophysics"
version = "0.4.0"
description = "Traceable engineering models for atmospheric and aerodynamic physics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["aerodynamics", "atmosphere", "compressible-flow", "engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
gui = [
  "plotly>=6.9,<7",
  "streamlit>=1.59,<2",
]

[project.scripts]
aerophysics-gui = "aerophysics.gui.launcher:main"

[project.urls]
Documentation = "https://github.com/pandorobo11/aerophysics/releases/latest"
Issues = "https://github.com/pandorobo11/aerophysics/issues"
Repository = "https://github.com/pandorobo11/aerophysics"

[tool.uv]
required-version = "==0.9.13"

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "scipy-stubs>=1.14",
]
docs = [
  "numpydoc>=1.8",
  "pydata-sphinx-theme>=0.16",
  "sphinx>=8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aerophysics"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=aerophysics",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]
testpaths = ["tests"]
markers = [
  "generated_assets: checks deterministic generated documentation and verification assets",
]

[tool.coverage.run]
source = ["aerophysics"]
omit = [
  "src/aerophysics/gui/app.py",
  "src/aerophysics/gui/analysis_pages.py",
  "src/aerophysics/gui/components.py",
  "src/aerophysics/gui/flow_pages.py",
  "src/aerophysics/gui/launcher.py",
  "src/aerophysics/gui/pages.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "NPY", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/aerophysics/gui/**/*.py" = ["RUF001"]
"tests/**/*.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
