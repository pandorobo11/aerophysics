<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Standard-atmosphere official-table diagnostics</title>
<desc id="svg-desc">The plot shows absolute differences divided by the official printed-cell tolerances for the U.S. Standard Atmosphere 1976.</desc>
<style>
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17202a}
.background{fill:#fff}.panel{fill:#fbfcfd;stroke:#b9c3cc;stroke-width:1}
.grid{stroke:#dfe5ea;stroke-width:1}.axis{stroke:#4d5b66;stroke-width:1.2}
.curve{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.reference{stroke:#777;stroke-width:1.4;stroke-dasharray:5 4}
.legend-line{stroke-width:2.3}.title{font-size:22px;font-weight:650}
.subtitle{font-size:13px;fill:#52616d}.panel-title{font-size:14px;font-weight:650}
.axis-label{font-size:12px;font-weight:600}.tick,.legend{font-size:10px}
</style>
<rect class="background" width="1200" height="470"/>
<text class="title" x="600.0" y="29" text-anchor="middle">Standard-atmosphere official-table diagnostics</text>
<text class="subtitle" x="600" y="50" text-anchor="middle">The horizontal line at one is the strict printed-digit diagnostic boundary; acceptance uses the documented wider criterion.</text>
